<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection — Neura Chat</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #0A0A0F; color: #fff; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card { max-width: 22rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 20px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: rgba(255,255,255,.5); line-height: 1.6; margin: 0 0 24px; font-size: .95rem; }
      button {
        background: #00FF87; color: #05240F; border: 0; border-radius: 12px;
        padding: 12px 22px; font-size: .95rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>
        Neura Chat needs the internet to show your conversations. Nothing has been lost —
        your messages are still arriving and will be here when you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
