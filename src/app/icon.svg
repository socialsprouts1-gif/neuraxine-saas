<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neura Chat">
  <title>Neura Chat</title>
  <defs>
    <linearGradient id="nx-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4E7EA"/>
      <stop offset="1" stop-color="#9AA1A8"/>
    </linearGradient>
    <linearGradient id="nx-lime" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6F53A"/>
      <stop offset="0.5" stop-color="#93DD1E"/>
      <stop offset="1" stop-color="#5FA80F"/>
    </linearGradient>
    <filter id="nx-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- N: a stem with a rounded shoulder, and the diagonal falling from it. -->
  <path
    d="M14 96 V38 a16 16 0 0 1 27.6-11L58 47.5 47.6 61.8 28 38.6 V96 Z"
    fill="url(#nx-silver)"
  />
  <!-- The white half of the X's descending stroke, continuing the N. -->
  <path d="M47.6 42 L79 82.5 68.2 96 37 55.6 Z" fill="url(#nx-silver)" />

  <!-- The X's rising stroke, and the leg falling away from the crossing. -->
  <g filter="url(#nx-glow)">
    <path d="M95 26 L106 39.5 55.5 100 44.5 86.5 Z" fill="url(#nx-lime)" />
    <path d="M75.2 55.5 L106 95.5 95 96 71 65.5 Z" fill="url(#nx-lime)" />
  </g>
</svg>
